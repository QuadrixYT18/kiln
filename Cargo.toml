[package]
name = "kiln"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Set up JVM projects in seconds and manage Gradle/Maven dependencies from the command line"
license = "MIT OR Apache-2.0"
repository = "https://github.com/QuadrixYT18/kiln"
homepage = "https://github.com/QuadrixYT18/kiln"
readme = "README.md"
keywords = ["gradle", "maven", "jvm", "dependencies", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "dist-workspace.toml", "release-please-config.json", ".release-please-manifest.json"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
dirs = "7"
futures = "0.3"
indicatif = "0.18"
inquire = "0.9"
owo-colors = "4"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync"] }
toml_edit = { version = "0.25", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Profile used by cargo-dist for release artifacts.
[profile.dist]
inherits = "release"
