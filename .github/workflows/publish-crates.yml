# Called by the cargo-dist "Release" workflow (see `publish-jobs` in dist-workspace.toml).
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist release plan (JSON)
        required: true
        type: string

permissions:
  contents: read

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
